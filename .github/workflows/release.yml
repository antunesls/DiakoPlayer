# Gera os releases do DiakoPlayer.
# Dispara ao enviar uma tag "v*" (ex.: git tag v1.0.1 && git push origin v1.0.1)
# ou manualmente pela aba Actions (informando a versão).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.1). A tag v<versão> será criada.'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.DIAKOPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DIAKOPLAYER_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret DIAKOPLAYER_KEYSTORE_BASE64 ausente: APK será assinado com chave de debug."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          DIAKOPLAYER_SIGNING_STORE_PASSWORD: ${{ secrets.DIAKOPLAYER_STORE_PASSWORD }}
          DIAKOPLAYER_SIGNING_KEY_ALIAS: ${{ secrets.DIAKOPLAYER_KEY_ALIAS }}
          DIAKOPLAYER_SIGNING_KEY_PASSWORD: ${{ secrets.DIAKOPLAYER_KEY_PASSWORD }}
          DIAKOPLAYER_VERSION_CODE: ${{ github.run_number }}
        run: |
          export DIAKOPLAYER_VERSION_NAME="${VERSION#v}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/DiakoPlayer-Remote-${VERSION#v}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/*.apk

  windows:
    name: App Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Compilar instalador e versão portátil
        working-directory: desktop
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis portable --publish never
          mkdir -p ../out
          cp dist/*.exe ../out/

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/*.exe

  release:
    name: Publicar release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          NOTES=$(cat <<'EOF'
          ## Downloads
          - **PC (Windows):** `DiakoPlayer Setup <versão>.exe` (instalador) ou `DiakoPlayer-<versão>-portable.exe` (sem instalar).
          - **Celular (Android):** `DiakoPlayer-Remote-<versão>.apk`.

          No PC: faça login no YouTube Music na janela do app e permita o acesso em **redes privadas** quando o Windows perguntar.
          No celular: abra o app no mesmo Wi-Fi; ele encontra o PC sozinho. Aprove o aparelho na janela que aparece no PC.
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" out/* --clobber
          else
            gh release create "$VERSION" out/* --title "DiakoPlayer ${VERSION#v}" --notes "$NOTES" --generate-notes --target "$GITHUB_SHA"
          fi
